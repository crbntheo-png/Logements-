<html lang="fr">
<head>
<meta charset="utf-8">

<title>Gestion SCI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : barre du haut + navigation, puis une colonne de contenu ; vert sapin pour l'action, rouge/ambre/vert pour l'état */
:root {
  --bg: #f3f5f3;
  --surface: #ffffff;
  --surface-2: #eef1ef;
  --ink: #1b2321;
  --muted: #5a6763;
  --line: #dbe1de;
  --accent: #1f5f56;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe7;
  --ok: #2b7a4b;   --ok-soft: #dff1e5;
  --warn: #9a5b00; --warn-soft: #fbecd2;
  --bad: #b3261e;  --bad-soft: #f8dedb;
  --paper: #ffffff; --paper-ink: #151515;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 16px;
  --sun: #ffc94a; --sky: #e6f3ef; --coral: #ff8a65;
  --hero-1: #1f6f61; --hero-2: #2f9a83;
  --shadow: 0 1px 2px rgba(20, 40, 35, .06), 0 6px 18px rgba(20, 40, 35, .07);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --surface: #19201e; --surface-2: #212a27; --ink: #e5ebe8; --muted: #9ba8a4; --line: #2d3734;
    --accent: #63b5a5; --accent-ink: #062019; --accent-soft: #1d3833;
    --ok: #74cf98; --ok-soft: #1b3326; --warn: #f0b660; --warn-soft: #3a2c14; --bad: #f28b82; --bad-soft: #3d1f1c;
    --sun: #f5c04a; --sky: #1a2b27; --coral: #ff9f80; --hero-1: #1c5a4f; --hero-2: #23806d; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #19201e; --surface-2: #212a27; --ink: #e5ebe8; --muted: #9ba8a4; --line: #2d3734;
  --accent: #63b5a5; --accent-ink: #062019; --accent-soft: #1d3833;
  --ok: #74cf98; --ok-soft: #1b3326; --warn: #f0b660; --warn-soft: #3a2c14; --bad: #f28b82; --bad-soft: #3d1f1c;
  --sun: #f5c04a; --sky: #1a2b27; --coral: #ff9f80; --hero-1: #1c5a4f; --hero-2: #23806d; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1rem; }
a { color: var(--accent); }
.num, td.num, .kpi b { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding-block: 10px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; display: flex; gap: 8px; align-items: center; }
.brand small { font-family: var(--font-body); font-weight: 500; color: var(--muted); font-size: .8rem; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; flex: 1 1 auto; min-width: 0; }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 7px 12px; border-radius: 8px; white-space: nowrap; font-weight: 600; font-size: .92rem; }
nav.tabs a:hover { background: var(--surface-2); color: var(--ink); }
nav.tabs a.on { background: var(--accent-soft); color: var(--accent); }
nav.tabs .badge { background: var(--bad); color: #fff; border-radius: 99px; font-size: .72rem; padding: 0 6px; margin-left: 4px; }

main { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 60px; display: flex; flex-direction: column; gap: 20px; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.head p { margin: 4px 0 0; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.card > h2 { margin-bottom: 10px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 20px; }
.stack > section.card { max-width: 640px; }
.two { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
@media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } }

.kpis { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.kpi span { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.kpi b { display: block; font-family: var(--font-display); font-size: 1.55rem; margin-top: 2px; }
.kpi small { color: var(--muted); }
.kpi.bad b { color: var(--bad); }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

button, .btn { font: inherit; font-weight: 600; font-size: .88rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 12px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
button:hover, .btn:hover { border-color: var(--accent); }
button.primary, .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { color: var(--bad); }
button.small { padding: 4px 9px; font-size: .8rem; }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); }

.pill { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--surface-2); color: var(--muted); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }

.tasks { display: flex; flex-direction: column; gap: 8px; }
.task { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px 10px 0; overflow: hidden; }
.task::before { content: ""; align-self: stretch; margin-block: -10px; background: var(--muted); }
.task.urgent::before { background: var(--bad); }
.task.soon::before { background: var(--warn); }
.task.info::before { background: var(--accent); }
.task .t { font-weight: 600; }
.task .d { color: var(--muted); font-size: .86rem; }
.task .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 560px) { .task { grid-template-columns: 4px minmax(0, 1fr); } .task .acts { grid-column: 2; justify-content: flex-start; } }
.group-title { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 8px 0 0; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }
td .sub { color: var(--muted); font-size: .8rem; }
tfoot td { font-weight: 700; background: var(--surface-2); }

.bien { display: flex; flex-direction: column; gap: 8px; }
.bien .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.bien .meta { color: var(--muted); font-size: .86rem; }
.bien dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; font-size: .88rem; }
.bien dt { color: var(--muted); } .bien dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.bien .row { margin-top: auto; padding-top: 6px; }

.banner { background: var(--warn-soft); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.empty { color: var(--muted); padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: var(--radius); }
.note { color: var(--muted); font-size: .85rem; }

.loc { display: flex; flex-direction: column; gap: 10px; }
.loc-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.loc-top h3 a { color: var(--ink); text-decoration: none; }
.loc-top h3 a:hover { text-decoration: underline; }
.loc .meta { color: var(--muted); font-size: .86rem; }
.loc-line { margin: 0; }
.loc-tasks { list-style: none; margin: 0; padding: 10px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; font-size: .88rem; }
.loc-tasks li { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.grid.locs { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
@media (max-width: 420px) { .grid.locs { grid-template-columns: minmax(0, 1fr); } }
details > summary { list-style-position: inside; }
.hero { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--accent); color: var(--accent-ink); border-radius: 16px; padding-block: 20px; padding-inline: 20px; }
.hero h1 { font-size: 1.7rem; }
.hero-k { margin: 0 0 4px; opacity: .8; font-weight: 600; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dots i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; opacity: .55; }
.dots i.ok { background: currentColor; opacity: 1; }
.dots i.bad { background: var(--bad); border-color: var(--bad); opacity: 1; }
h2.sec { font-size: 1.15rem; display: flex; gap: 8px; align-items: center; margin: 0 0 10px; }
.todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.todo li { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.todo li.urgent { border-color: var(--bad); background: var(--bad-soft); }
.todo .ico { font-size: 1.3rem; line-height: 1; }
.todo .tx { flex: 1; min-width: 0; font-weight: 600; }
.todo .tx small { display: block; font-weight: 500; color: var(--muted); }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; border-left-width: 5px; }
.tile.ok { border-left-color: var(--ok); } .tile.warn { border-left-color: var(--warn); } .tile.bad { border-left-color: var(--bad); } .tile.info { border-left-color: var(--line); }
.tile-head { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
.tile-head span:nth-child(2) { flex: 1; min-width: 0; }
.tile-head b { display: block; } .tile-head small { color: var(--muted); }
.chev { font-size: 1.6rem; color: var(--muted); }
.tile-state { font-weight: 700; font-size: 1.05rem; }
.tile.bad .tile-state { color: var(--bad); }
.tile .row { margin-top: auto; }
.tile .row button { flex: 1; justify-content: center; padding-block: 10px; }
.avatar { width: 42px; height: 42px; border-radius: 50%; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; flex: none; font-family: var(--font-display); }
@media (max-width: 420px) { .tiles { grid-template-columns: minmax(0, 1fr); } .hero h1 { font-size: 1.4rem; } }
.gear { display: none; margin-left: auto; text-decoration: none; font-size: 1.3rem; }
@media (max-width: 700px) { .gear { display: inline-block; } }
.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.quick button { flex-direction: column; gap: 4px; border-radius: 16px; padding: 14px 8px; background: var(--surface); box-shadow: var(--shadow); border-color: transparent; white-space: normal; text-align: center; font-size: .85rem; }
.quick button span { font-size: 1.6rem; }
.search input { font-size: 1.05rem; padding: 14px 16px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); border-color: transparent; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.chip { border-radius: 999px; background: var(--surface); white-space: nowrap; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.todo.docs .tx a { color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
.todo.docs .tx a:hover { text-decoration: underline; }
ul.rel { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 8px; }
ul.rel li { background: var(--bg); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
ul.rel small { color: var(--muted); overflow-wrap: anywhere; }
ul.rel .row select { flex: 1; min-width: 140px; }
/* Fenêtres */
.overlay { position: fixed; inset: 0; background: rgba(10, 15, 13, .55); z-index: 50; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); border-radius: 14px; width: min(720px, 100%); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.modal .mh { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
form.f { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
form.f .full { grid-column: 1 / -1; }
@media (max-width: 560px) { form.f { grid-template-columns: minmax(0, 1fr); } }
label.fl { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; font-weight: 600; color: var(--muted); }
label.fl.chk { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); }
input, select, textarea { font: inherit; font-size: .95rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
input[type=checkbox] { width: auto; }
textarea { min-height: 70px; resize: vertical; }
fieldset { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px 12px; display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-column: 1 / -1; margin: 0; }

@media (max-width: 560px) { fieldset { grid-template-columns: minmax(0, 1fr); } }
.calc { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; grid-column: 1 / -1; }

/* Documents (papier) */
.docbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; width: min(840px, 100%); margin-bottom: 12px; }
.docbar .row { gap: 6px; }
.docwrap { display: flex; flex-direction: column; align-items: center; width: 100%; }
.paper { background: var(--paper); color: var(--paper-ink); width: min(840px, 100%); padding: 56px 60px; border-radius: 4px; font: 13.5px/1.55 Georgia, "Times New Roman", serif; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.paper h1 { font-family: Georgia, serif; font-size: 22px; text-align: center; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 4px; }
.paper h2 { font-family: Georgia, serif; font-size: 15px; margin: 18px 0 6px; text-transform: uppercase; letter-spacing: .03em; border-bottom: 1px solid #999; padding-bottom: 3px; }
.paper .center { text-align: center; }
.paper .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 18px 0; }
.paper .box { border: 1px solid #333; padding: 10px 14px; }
.paper table { font-size: 13.5px; margin: 10px 0; }
.paper th, .paper td { border: 1px solid #999; padding: 6px 10px; color: var(--paper-ink); background: transparent; text-transform: none; letter-spacing: 0; font-size: 13.5px; }

.paper .sign div { min-height: 90px; }

.paper p { margin: 6px 0; }
@media (max-width: 600px) { .paper { padding: 28px 20px; } .paper .two-col, .paper .sign { grid-template-columns: 1fr; } }
.emailbox { width: min(840px, 100%); margin-top: 12px; background: var(--surface); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.emailbox textarea { min-height: 120px; }

/* ===== Habillage "appli" ===== */
body { background: radial-gradient(1200px 400px at 50% -200px, var(--sky), transparent 70%), var(--bg); background-attachment: fixed; }
.card, .kpi, .table-wrap, .todo li, .tile, .task { box-shadow: var(--shadow); border-color: transparent; }
.card, .kpi, .tile, .todo li { border-radius: var(--radius); }
.tile { border-left-width: 0; position: relative; overflow: hidden; transition: transform .15s ease, box-shadow .15s ease; }
.tile::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--line); }
.tile.ok::before { background: var(--ok); } .tile.warn::before { background: var(--sun); } .tile.bad::before { background: var(--bad); }
.tile:hover { transform: translateY(-2px); }
button, .btn { border-radius: 999px; padding: 8px 16px; }
button.small { padding: 5px 12px; }
.tile .row button { padding-block: 11px; font-size: .95rem; }
.greet { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.greet h1 { font-size: 1.9rem; }
.greet p { margin: 2px 0 0; color: var(--muted); }
.hero { background: linear-gradient(135deg, var(--hero-1), var(--hero-2)); color: #fff; position: relative; overflow: hidden; padding-block: 22px; padding-inline: 22px; border-radius: 22px; box-shadow: var(--shadow); align-items: center; }
.hero .hero-k { color: #fff; opacity: .85; }
.hero h1 { color: #fff; }
.hero .sub { margin: 4px 0 0; opacity: .9; font-weight: 600; }
.hero { flex-wrap: nowrap; }
.hero > div:first-child { flex: 1; min-width: 0; position: relative; z-index: 1; }
.ring { z-index: 1; }
.hero .skyline { position: absolute; right: -10px; bottom: -6px; width: 230px; opacity: .16; pointer-events: none; }
.ring { position: relative; width: 104px; height: 104px; flex: none; }

.hero .dots i { border-color: #fff; } .hero .dots i.ok { background: var(--sun); border-color: var(--sun); } .hero .dots i.bad { background: var(--coral); border-color: var(--coral); }
.todo li { padding: 14px 16px; }
.todo li.urgent { background: var(--bad-soft); }
.todo .ico { width: 42px; height: 42px; border-radius: 12px; background: var(--sky); display: inline-flex; align-items: center; justify-content: center; font-size: 1.3rem; flex: none; }
.todo li.urgent .ico { background: var(--surface); }
.empty.party { font-size: 1.1rem; padding: 28px; background: var(--surface); border: 0; box-shadow: var(--shadow); }

.avatar { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--sky); }
.house { font-size: 1.1rem; }
.bien { border-top: 0; }
.bien .emoji { width: 52px; height: 52px; border-radius: 16px; background: var(--sky); display: inline-flex; align-items: center; justify-content: center; font-size: 1.7rem; flex: none; }
.bien .top { align-items: center; }
.bien .top > div:nth-child(2) { flex: 1; min-width: 0; }
/* Barre d'onglets en bas sur téléphone, comme une vraie appli */

<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><span id="brandName">Gestion SCI</span><small id="brandSub"></small></div><a class="gear" href="#reglages" aria-label="Réglages">⚙️</a>
    <nav class="tabs" id="nav"></nav>
  </div>
</header>
<nav id="bottomnav" aria-label="Navigation"></nav>
<main id="app"></main>
<div id="overlay" class="overlay" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div id="pdfstage" aria-hidden="true" style="position:absolute;left:-10000px;top:0;width:840px"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
/* ================= Données ================= */
const KEY = "gestion-sci-v1";
const blank = () => ({
  version: 1, demo: false,
  sci: { nom: "", siege: "", siren: "", gerant: "", ville: "", regime: "IR", familiale: false, iban: "", telephone: "", email: "", associes: [] },
  biens: [], baux: [], paiements: [], depenses: [], quittances: {}, relances: [], faits: {}, rappels: [], irlPerso: {}, taxes: [], banqueVus: {}
});
const uid = () => Math.random().toString(36).slice(2, 10);
function loadLocal() {
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
  return null;
}
let S = blank();

/* Stockage : en ligne et partagé entre associés quand c'est possible (db),
   sinon dans ce navigateur. Chaque bien, bail, paiement… est un document. */
const COLLS = ["biens", "baux", "paiements", "depenses", "relances", "rappels", "taxes"];
const META_KEYS = ["sci", "faits", "quittances", "irlPerso", "demo", "lastExport", "banqueVus"];
let DB = null, MODE = "chargement", synced = {}, writeQueue = Promise.resolve(), pendingRender = false;
const metaObj = () => { const m = {}; META_KEYS.forEach(k => { if (S[k] !== undefined) m[k] = S[k]; }); return m; };
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (MODE !== "partage") return;
  const push = (path, val) => {
    writeQueue = writeQueue.then(() => val === null ? DB.doc(path).delete() : DB.doc(path).set(val)).catch(err => {
      if (err && err.code === "invalid_argument") toast("Tu n'as pas le droit de modifier ces données (demande l'accès Éditeur).");
      else toast("Enregistrement en ligne impossible pour l'instant.");
    });
  };
  COLLS.forEach(c => {
    const seen = new Set();
    (S[c] || []).forEach(it => { const p = c + "/" + it.id, j = JSON.stringify(it); seen.add(p); if (synced[p] !== j) { synced[p] = j; push(p, JSON.parse(j)); } });
    Object.keys(synced).filter(p => p.startsWith(c + "/") && !seen.has(p)).forEach(p => { delete synced[p]; push(p, null); });
  });
  const mj = JSON.stringify(metaObj());
  if (synced["meta/main"] !== mj) { synced["meta/main"] = mj; push("meta/main", JSON.parse(mj)); }
}
function remoteChanged() {
  if (!document.getElementById("overlay").hidden) { pendingRender = true; return; }
  render();
}
async function boot() {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { MODE = "local"; S = loadLocal() || blank(); render(); initExtras(); return; }
  DB = db; let waiting = COLLS.length + 1;
  const ready = () => { if (--waiting === 0) { MODE = "partage"; render(); } };
  COLLS.forEach(c => {
    let first = true;
    db.collection(c).onSnapshot(snap => {
      Object.keys(synced).filter(p => p.startsWith(c + "/")).forEach(p => delete synced[p]);
      S[c] = snap.docs.map(d => { const v = JSON.parse(JSON.stringify(d.data())); synced[c + "/" + d.id] = JSON.stringify(v); return v; });
      if (first) { first = false; ready(); } else if (MODE === "partage") remoteChanged();
    }, () => { if (first) { first = false; ready(); } });
  });
  let firstMeta = true;
  db.doc("meta/main").onSnapshot(snap => {
    const m = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : {};
    const b = blank(); META_KEYS.forEach(k => { S[k] = m[k] !== undefined ? m[k] : b[k]; });
    synced["meta/main"] = JSON.stringify(metaObj());
    if (firstMeta) { firstMeta = false; ready(); } else if (MODE === "partage") remoteChanged();
  }, () => { if (firstMeta) { firstMeta = false; ready(); } });
  initExtras();
}

/* Envoi d'e-mails (Gmail) et téléchargement de PDF, quand la page y a accès */
let MCP = null, DL = null, GMAIL_TOOL = "send_message";
async function initExtras() {
  try { MCP = window.claude && window.claude.use ? await window.claude.use("mcp") : null; } catch (e) { MCP = null; }
  try { DL = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { DL = null; }
  if (MODE !== "chargement") render();
}
const peutEnvoyer = () => !!MCP;

/* ================= Outils dates & montants ================= */
const pad = n => String(n).padStart(2, "0");
const TODAY = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); })();
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const P = s => { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d || 1); };
const mk = d => d.getFullYear() + "-" + pad(d.getMonth() + 1);
const CUR = mk(TODAY);
const addM = (m, n) => { const [y, mo] = m.split("-").map(Number); return mk(new Date(y, mo - 1 + n, 1)); };
const dim = m => { const [y, mo] = m.split("-").map(Number); return new Date(y, mo, 0).getDate(); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const addYears = (d, n) => new Date(d.getFullYear() + n, d.getMonth(), d.getDate());
const daysBetween = (a, b) => Math.round((b - a) / 86400000);
const fd = s => { const d = typeof s === "string" ? P(s) : s; return d ? d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }).replace(/^1 /, "1er ") : "—"; };
const fds = s => { const d = typeof s === "string" ? P(s) : s; return d ? d.toLocaleDateString("fr-FR") : "—"; };
const fm = m => { const [y, mo] = m.split("-").map(Number); return new Date(y, mo - 1, 1).toLocaleDateString("fr-FR", { month: "long", year: "numeric" }); };
const EUR = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
const eur = n => EUR.format(Math.round((+n || 0) * 100) / 100);
const r2 = n => Math.round(n * 100) / 100;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nl2br = s => esc(s).replace(/\n/g, "<br>");

/* Montant en lettres (obligatoire en pratique sur une quittance) */
const U = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
const T = ["","","vingt","trente","quarante","cinquante","soixante","soixante","quatre-vingt","quatre-vingt"];
function n100(n) {
  if (n < 20) return U[n];
  const t = Math.floor(n / 10), u = n % 10;
  if (t === 7 || t === 9) return T[t] + (t === 7 && u === 1 ? " et " : "-") + U[10 + u];
  if (u === 0) return T[t] + (t === 8 ? "s" : "");
  if (u === 1 && t !== 8) return T[t] + " et un";
  return T[t] + "-" + U[u];
}
function n1000(n) {
  const h = Math.floor(n / 100), r = n % 100; let s = "";
  if (h) s = h === 1 ? "cent" : U[h] + " cent" + (r === 0 ? "s" : "");
  if (r) s += (s ? " " : "") + n100(r);
  return s;
}
function nWords(n) {
  if (n === 0) return "zéro";
  const m = Math.floor(n / 1e6), k = Math.floor((n % 1e6) / 1000), r = n % 1000, out = [];
  if (m) out.push(m === 1 ? "un million" : n1000(m).replace(/cents$/, "cent") + " millions");
  if (k) out.push(k === 1 ? "mille" : n1000(k).replace(/cents$/, "cent") + " mille");
  if (r) out.push(n1000(r));
  return out.join(" ");
}
function enLettres(x) {
  x = r2(+x || 0); const e = Math.floor(x), c = Math.round((x - e) * 100);
  let s = nWords(e) + " euro" + (e > 1 ? "s" : "");
  if (c) s += " et " + nWords(c) + " centime" + (c > 1 ? "s" : "");
  return s;
}

/* ================= Règles métier ================= */
const bien = id => S.biens.find(b => b.id === id);
const bail = id => S.baux.find(b => b.id === id);
const bienLabel = b => b ? b.nom : "—";
const adresseBien = b => b ? [b.adresse, [b.cp, b.ville].filter(Boolean).join(" ")].filter(Boolean).join(", ") : "";
const isActive = (b, d = TODAY) => P(b.dateEntree) <= d && (!b.dateSortie || P(b.dateSortie) >= d);
const bailActifDuBien = id => S.baux.find(b => b.bienId === id && isActive(b));
const TYPES_BAIL = { vide: "Location vide (loi du 6 juillet 1989)", meuble: "Location meublée", etudiant: "Location meublée étudiant (9 mois)", mobilite: "Bail mobilité" };

function dureeBail(b) {
  if (b.typeBail === "vide") return S.sci.familiale ? { mois: 36, txt: "3 ans" } : { mois: 72, txt: "6 ans" };
  if (b.typeBail === "meuble") return { mois: 12, txt: "1 an" };
  if (b.typeBail === "etudiant") return { mois: 9, txt: "9 mois" };
  return { mois: +b.dureeMobilite || 10, txt: (+b.dureeMobilite || 10) + " mois" };
}
function loyerAt(b, m) {
  const revs = (b.revisions || []).filter(r => r.depuis <= m).sort((a, c) => a.depuis.localeCompare(c.depuis));
  const r = revs[revs.length - 1];
  return r ? { hc: +r.loyerHC, ch: +r.charges } : { hc: +b.loyerHC || 0, ch: +b.charges || 0 };
}
/* Échéance d'un bail pour un mois donné (avec prorata d'entrée/sortie) */
function echeance(b, m) {
  const start = mk(P(b.dateEntree)), suivi = b.suiviDepuis || start;
  if (m < start || m < suivi) return null;
  if (b.dateSortie && m > mk(P(b.dateSortie))) return null;
  const days = dim(m); let from = 1, to = days;
  if (m === start) from = P(b.dateEntree).getDate();
  if (b.dateSortie && m === mk(P(b.dateSortie))) to = P(b.dateSortie).getDate();
  const f = (to - from + 1) / days, L = loyerAt(b, m);
  const hc = r2(L.hc * f), ch = r2(L.ch * f), du = r2(hc + ch);
  const j = Math.min(+b.jourPaiement || 1, days);
  const dueDate = new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, j);
  const pays = S.paiements.filter(p => p.bailId === b.id && p.mois === m);
  const paye = r2(pays.reduce((s, p) => s + (+p.montant || 0), 0));
  const reste = r2(Math.max(0, du - paye));
  let statut;
  if (du <= 0) statut = "paye";
  else if (paye >= du - 0.009) statut = "paye";
  else if (TODAY > dueDate) statut = "retard";
  else statut = paye > 0 ? "partiel" : "avenir";
  const retardJ = statut === "retard" ? daysBetween(dueDate, TODAY) : 0;
  const lastPay = pays.map(p => p.date).sort().pop();
  return { b, m, hc, ch, du, paye, reste, statut, dueDate, retardJ, from, to, days, prorata: f < 1, lastPay, pays,
    quittance: S.quittances[b.id + "|" + m], relances: S.relances.filter(r => r.bailId === b.id && r.mois === m) };
}
function echeancesBail(b, upTo = CUR) {
  const out = []; let m = b.suiviDepuis || mk(P(b.dateEntree));
  if (m < mk(P(b.dateEntree))) m = mk(P(b.dateEntree));
  let guard = 0;
  while (m <= upTo && guard++ < 600) { const e = echeance(b, m); if (e) out.push(e); m = addM(m, 1); }
  return out;
}
const toutesEcheances = (upTo = CUR) => S.baux.flatMap(b => echeancesBail(b, upTo));
const STATUT = { paye: ["ok", "Payé"], partiel: ["warn", "Partiel"], retard: ["bad", "En retard"], avenir: ["info", "À venir"] };
const pillStatut = e => { const [c, l] = STATUT[e.statut]; return `<span class="pill ${c}">${l}${e.statut === "retard" ? " · " + e.retardJ + " j" : ""}</span>`; };
const fait = k => S.faits[k];

/* ================= Indice de référence des loyers (IRL, INSEE, métropole) ================= */
/* Clé "année-trimestre". Publié vers le 15 du mois qui suit la fin du trimestre. */
const IRL = {
  "2019-1": 129.38, "2019-2": 129.72, "2019-3": 129.99, "2019-4": 130.26,
  "2020-1": 130.57, "2020-2": 130.57, "2020-3": 130.59, "2020-4": 130.52,
  "2021-1": 130.69, "2021-2": 131.12, "2021-3": 131.67, "2021-4": 132.62,
  "2022-1": 133.93, "2022-2": 135.84, "2022-3": 136.27, "2022-4": 137.26,
  "2023-1": 138.61, "2023-2": 140.59, "2023-3": 141.03, "2023-4": 142.06,
  "2024-1": 143.46, "2024-2": 145.17, "2024-3": 144.51, "2024-4": 144.64,
  "2025-1": 145.47, "2025-2": 146.68, "2025-3": 145.77, "2025-4": 145.78,
  "2026-1": 146.60, "2026-2": 148.37, "2026-3": 148.06
};
const qKey = l => { const m = /T\s*([1-4])\D*(\d{4})/i.exec(l || ""); return m ? m[2] + "-" + m[1] : null; };
const qLabel = k => { const [y, q] = k.split("-"); return "T" + q + " " + y; };
const qPub = k => { const [y, q] = k.split("-").map(Number); return q === 4 ? new Date(y + 1, 0, 15) : new Date(y, q * 3, 15); };
const irlTable = () => Object.assign({}, IRL, S.irlPerso || {});
const irlVal = k => irlTable()[k];
const irlCles = () => Object.keys(irlTable()).sort((a, b) => { const [ya, qa] = a.split("-").map(Number), [yb, qb] = b.split("-").map(Number); return ya - yb || qa - qb; });
function irlEnVigueur(d) { const ks = irlCles(); let best = null; ks.forEach(k => { if (qPub(k) <= d) best = k; }); return best || ks[0]; }
function irlProchain() { const ks = irlCles(), [y, q] = ks[ks.length - 1].split("-").map(Number); const k = q === 4 ? (y + 1) + "-1" : y + "-" + (q + 1); return { k, pub: qPub(k) }; }
const fmtIrl = v => String(v).replace(".", ",");

/* Révision annuelle : ce qu'il faut faire pour un bail, calculé tout seul */
function revInfo(b) {
  if (!isActive(b) || b.revisable === false || b.typeBail === "mobilite") return null;
  const entree = P(b.dateEntree); let n = TODAY.getFullYear() - entree.getFullYear(); let anniv = addYears(entree, n);
  if (anniv > addDays(TODAY, 30)) anniv = addYears(entree, --n);
  if (n < 1 || daysBetween(anniv, TODAY) >= 365) return null;
  const lastRev = (b.revisions || []).map(r => r.date).sort().pop();
  if (lastRev && P(lastRev) >= addDays(anniv, -45)) return null;
  const key = "rev-" + b.id + "-" + iso(anniv);
  if (fait(key)) return null;
  const bi = bien(b.bienId);
  if (bi && (bi.dpe === "F" || bi.dpe === "G")) return { key, anniv, statut: "gele" };
  const ref = qKey(b.irlTrimestre) || irlEnVigueur(entree), q = ref.split("-")[1];
  let y = anniv.getFullYear() + 1; while (qPub(y + "-" + q) > anniv) y--;
  const newKey = y + "-" + q, oldKey = (y - 1) + "-" + q;
  const newVal = irlVal(newKey), oldVal = irlVal(oldKey) || +b.irlValeur;
  const ancien = loyerAt(b, mk(anniv)).hc;
  if (!newVal || !oldVal) return { key, anniv, statut: "attente", newKey, pub: qPub(newKey), ancien };
  const nouveau = r2(ancien * newVal / oldVal);
  return { key, anniv, statut: "pret", newKey, oldKey, newVal, oldVal, ancien, nouveau, charges: loyerAt(b, mk(anniv)).ch };
}

/* ================= Tâches automatiques ================= */
function taches() {
  const T = [], y = TODAY.getFullYear();
  const add = (o) => T.push(o);
  const ech = toutesEcheances();
  // 1. Impayés
  ech.filter(e => e.statut === "retard").forEach(e => {

  const parts = S.baux.filter(b => b.bienId === bienId).map(b => {

  if (e.paye > 0 && e.statut !== "paye") a.push(`<button class="small" onclick="quittance('${e.b.id}','${e.m}')">Reçu partiel</button>`);
  if (e.statut === "retard") a.push(`<button class="small danger" onclick="relance('${e.b.id}','${e.m}')">Relancer</button>`);
  if (e.statut === "avenir") a.push(`<button class="small ghost" onclick="avis('${e.b.id}','${e.m}')">Avis</button>`);
  if (e.pays.length) a.push(`<button class="small ghost" title="Annuler le dernier paiement" aria-label="Annuler le dernier paiement" onclick="annulerPaiement('${e.b.id}','${e.m}')">↺</button>`);
  return a.join("");
}

const CATS = ["Taxe foncière", "Charges de copropriété", "Assurance propriétaire (PNO)", "Assurance loyers impayés", "Travaux d'entretien / réparation", "Travaux d'amélioration", "Intérêts d'emprunt", "Assurance emprunteur", "Remboursement capital emprunt", "Frais bancaires", "Honoraires (comptable, notaire, avocat…)", "Diagnostics", "Eau / électricité / gaz", "Frais de gestion / annonces", "Autre"];
function recettes(year) {
  const by = {};
  S.paiements.filter(p => (p.date || "").startsWith(String(year))).forEach(p => {
    const b = bail(p.bailId); if (!b) return; const e = echeance(b, p.mois); const part = e && e.du ? e.ch / e.du : 0;
    const k = b.bienId; by[k] = by[k] || { loyers: 0, charges: 0 };
    by[k].charges += p.montant * part; by[k].loyers += p.montant * (1 - part);
  });
  (S.taxes || []).forEach(tx => tx.parts.filter(p => p.payeLe && p.payeLe.startsWith(String(year))).forEach(p => { by[tx.bienId] = by[tx.bienId] || { loyers: 0, charges: 0 }; by[tx.bienId].charges += p.montant; }));
  return by;
}

  ${lignes.map(l => `<tr><td class="rt-head"><b>${esc(l.nom)}</b></td><td class="num" data-l="Loyers">${eur(l.loyers)}</td><td class="num" data-l="Charges reçues">${eur(l.charges)}</td><td class="num" data-l="Dépenses">${eur(l.dep)}</td><td class="num" data-l="Résultat"><b>${eur(l.res)}</b></td></tr>`).join("")}

/* ================= Formulaires ================= */
function fld(label, name, value, type = "text", cls = "", extra = "") {
  return `<label class="fl ${cls}">${label}<input id="f_${name}" name="${name}" type="${type}" value="${esc(value ?? "")}" ${type === "number" ? 'step="0.01" inputmode="decimal"' : ""} ${extra}></label>`;
}
function sel(label, name, value, opts, cls = "", extra = "") {
  return `<label class="fl ${cls}">${label}<select id="f_${name}" name="${name}" ${extra}>${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(value ?? "") ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></label>`;
}
function area(label, name, value, cls = "full") { return `<label class="fl ${cls}">${label}<textarea id="f_${name}" name="${name}">${esc(value ?? "")}</textarea></label>`; }
function modal(title, body, onSubmit, opts = {}) {
  const o = document.getElementById("overlay");
  o.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h2>${title}</h2><button class="ghost" onclick="closeOverlay()" aria-label="Fermer">✕</button></div>
  <form class="f" id="mform">${body}<div class="full row" style="justify-content:space-between"><div class="row">${opts.del ? `<button type="button" class="danger" id="mdel">Supprimer</button>` : ""}</div><div class="row">${opts.lecture ? "" : `<button type="button" onclick="closeOverlay()">Annuler</button>`}<button class="primary">${opts.ok || "Enregistrer"}</button></div></div></form></div>`;
  o.hidden = false;
  const f = document.getElementById("mform");
  f.addEventListener("submit", ev => { ev.preventDefault(); const d = Object.fromEntries(new FormData(f).entries()); f.querySelectorAll("input[type=checkbox]").forEach(c => d[c.name] = c.checked); if (onSubmit(d, f) !== false) { closeOverlay(); save(); render(); } });
  if (opts.del) document.getElementById("mdel").onclick = () => confirmer(opts.delMsg || "Supprimer ?", () => { opts.del(); save(); render(); });
  if (opts.after) opts.after(f);
  const first = f.querySelector("input:not([type=checkbox]),select,textarea"); if (first && matchMedia("(pointer: fine)").matches) first.focus();
}
function closeOverlay() { const o = document.getElementById("overlay"); o.hidden = true; o.innerHTML = ""; if (pendingRender) { pendingRender = false; } render(); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && !document.getElementById("overlay").hidden) closeOverlay(); });
function confirmer(msg, yes) {
  const o = document.getElementById("overlay");
  o.innerHTML = `<div class="modal" role="alertdialog" style="width:min(460px,100%)"><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button onclick="closeOverlay()">Annuler</button><button class="primary" id="cyes">Confirmer</button></div></div>`;
  o.hidden = false; document.getElementById("cyes").onclick = () => { closeOverlay(); yes(); };
}

/* Fabrique un vrai PDF (texte) à partir du document affiché */
function fairePdf(html) {
  if (!window.jspdf) throw new Error("PDF indisponible (connexion internet nécessaire)");
  const stage = document.getElementById("pdfstage");
  stage.innerHTML = `<div class="paper">${html}</div>`;
  const root = stage.firstChild;
  const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });

  const clean = t => String(t).replace(/[   ]/g, " ").replace(/[ \t]+/g, " ").trim();
  const lines = el => (el.innerText || el.textContent || "").split("\n").map(clean).filter(Boolean);
  const ensure = h => { if (y + h > H - M) { doc.addPage(); y = M; } };
  const lh = size => size * 0.3528 * 1.4;
  function write(text, o = {}) {
    const size = o.size || 10, x = o.x ?? M, w = o.w ?? W;
    doc.setFont("helvetica", o.bold ? "bold" : "normal"); doc.setFontSize(size);
    doc.splitTextToSize(clean(text), w).forEach(l => { ensure(lh(size)); const ax = o.align === "right" ? x + w : o.align === "center" ? x + w / 2 : x; doc.text(l, ax, y + lh(size) * 0.75, { align: o.align || "left" }); y += lh(size); });
  }
  function column(el, x, w) { const y0 = y; const ls = lines(el); const align = el.classList.contains("right") ? "right" : "left"; ls.forEach((l, i) => write(l, { x, w, align, bold: i === 0, size: 9.5 })); const y1 = y; y = y0; return y1; }
  function table(el) {
    const rows = [...el.querySelectorAll("tr")]; if (!rows.length) return;
    const n = Math.max(...rows.map(r => r.cells.length));
    const widths = n === 2 ? [W * 0.62, W * 0.38] : [W * 0.34, ...Array(n - 1).fill(W * 0.66 / (n - 1))];
    y += 1;
    rows.forEach(r => {
      const cells = [...r.cells], bold = !!r.querySelector("b, th"), size = 9.5;
      doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(size);
      const split = cells.map((c, i) => doc.splitTextToSize(clean(c.innerText || c.textContent), widths[i] - 4));
      const h = Math.max(...split.map(s => s.length)) * lh(size) + 2.5;
      ensure(h); let x = M;
      cells.forEach((c, i) => { doc.rect(x, y, widths[i], h); const right = c.classList.contains("right") || c.classList.contains("num") || (i > 0 && n === 2); split[i].forEach((l, k) => doc.text(l, right ? x + widths[i] - 2 : x + 2, y + 1.25 + lh(size) * (k + 0.75), { align: right ? "right" : "left" })); x += widths[i]; });
      y += h;
    });
    y += 2;
  }
  function block(el) {
    const tag = el.tagName, cl = el.classList;
    if (tag === "DIV" && (cl.contains("two-col") || cl.contains("sign"))) {
      const kids = [...el.children]; y += 2; ensure(30);
      const y1 = column(kids[0], M, W / 2 - 5), y2 = kids[1] ? column(kids[1], M + W / 2 + 5, W / 2 - 5) : y;
      y = Math.max(y1, y2) + (cl.contains("sign") ? 25 : 4); return;
    }
    if (tag === "H1") { y += 3; write(el.textContent, { size: 15, bold: true, align: "center" }); y += 1; return; }
    if (tag === "H2") { y += 3; ensure(10); write(el.textContent.toUpperCase(), { size: 10.5, bold: true }); doc.setLineWidth(0.2); doc.line(M, y + 0.5, M + W, y + 0.5); y += 2.5; return; }
    if (tag === "TABLE") { table(el); return; }
    if (tag === "UL" || tag === "OL") { [...el.children].forEach(li => { const y0 = y; write("•", { x: M + 2, w: 4 }); y = y0; write(li.textContent, { x: M + 7, w: W - 7 }); }); y += 1; return; }
    if (tag === "DIV" && !cl.length) { [...el.children].forEach(block); if (!el.children.length) lines(el).forEach(l => write(l)); return; }
    const align = cl.contains("right") ? "right" : cl.contains("center") ? "center" : "left";
    const size = cl.contains("small") ? 8 : 10;
    if (parseFloat(el.style.marginTop) > 20) y += 6;
    const bold = el.children.length === 1 && el.firstElementChild.tagName === "B" && clean(el.textContent) === clean(el.firstElementChild.textContent);
    lines(el).forEach(l => write(l, { align, size, bold }));
    y += 2;
  }
  [...root.children].forEach(block);
  stage.innerHTML = "";
  return doc;
}

function docBilanOpen(y) {

  const t = rows.reduce((a, r) => ({ l: a.l + r.loyers, c: a.c + r.charges, d: a.d + r.d }), { l: 0, c: 0, d: 0 });

  <h2>Dépenses par catégorie</h2><table><tbody>${Object.entries(parCat).map(([c, v]) => `<tr><td>${esc(c)}</td><td class="right">${eur(v)}</td></tr>`).join("") || "<tr><td>Aucune dépense</td><td></td></tr>"}</tbody></table>
  ${parts ? `<h2>Répartition entre associés</h2><table><tbody>${S.sci.associes.map(a => `<tr><td>${esc(a.nom)} (${a.parts} parts)</td><td class="right">${eur(res * a.parts / parts)}</td></tr>`).join("")}</tbody></table>` : ""}
  <p class="small">Document de gestion indicatif établi à partir des encaissements et des dépenses saisis. Il ne remplace pas la déclaration fiscale (2072 ou liasse IS).</p>`, { titre: "Bilan " + y, fichier: `Bilan-${slug(S.sci.nom || "SCI")}-${y}` });

/* ================= Sauvegardes & exports ================= */
function download(name, content, type) {
  if (DL) { DL.save({ filename: name, data: content }).then(() => toast("Fichier enregistré"), e => { if (e && e.code !== "declined") toast("Téléchargement impossible ici."); }); return; }
  const blob = new Blob([content], { type }), a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportJSON() { S.lastExport = new Date().toISOString(); save(); download(`sauvegarde-${slug(S.sci.nom || "sci")}-${iso(TODAY)}.json`, JSON.stringify(S, null, 1), "application/json"); render(); }
document.getElementById("importFile").addEventListener("change", ev => {
  const f = ev.target.files[0]; if (!f) return; const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d.biens || !d.baux) throw 0; confirmer(`Remplacer les données de cet appareil par la sauvegarde "${f.name}" ?`, () => { S = Object.assign(blank(), d); save(); render(); toast("Sauvegarde ouverte"); }); } catch (e) { toast("Ce fichier n'est pas une sauvegarde de l'appli."); } ev.target.value = ""; };
  r.readAsText(f);
});
function exportCSV(y) {
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`, n = v => String(r2(v)).replace(".", ",");
  const rows = [["Date", "Sens", "Bien", "Catégorie", "Libellé", "Locataire", "Montant"]];
  S.paiements.filter(p => (p.date || "").startsWith(String(y))).forEach(p => { const b = bail(p.bailId); rows.push([p.date, "Recette", b ? bienLabel(bien(b.bienId)) : "", "Loyer et charges", "Loyer " + p.mois + " (" + p.mode + ")", b ? b.nom : "", n(p.montant)]); });
  (S.taxes || []).forEach(tx => tx.parts.filter(p => p.payeLe && p.payeLe.startsWith(String(y))).forEach(p => { const b = bail(p.bailId); rows.push([p.payeLe, "Recette", bienLabel(bien(tx.bienId)), "Ordures ménagères refacturées", "TEOM " + tx.annee, b ? b.nom : "", n(p.montant)]); }));
  S.depenses.filter(d => (d.date || "").startsWith(String(y))).forEach(d => rows.push([d.date, "Dépense", d.bienId ? bienLabel(bien(d.bienId)) : "SCI", d.categorie, d.libelle, "", n(-d.montant)]));
  rows.sort((a, b) => a[0] < b[0] ? -1 : 1);
  download(`compta-${slug(S.sci.nom || "sci")}-${y}.csv`, "﻿" + rows.map(r => r.map(q).join(";")).join("\n"), "text/csv");
}
function confettis() {
  try { if (matchMedia("(prefers-reduced-motion: reduce)").matches) return; } catch (e) {}
  const c = document.createElement("canvas"), W = innerWidth, H = innerHeight; c.width = W; c.height = H;
  c.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:70"; document.body.appendChild(c);
  const x = c.getContext("2d"), cols = ["#ffc94a", "#2f9a83", "#ff8a65", "#5868b8", "#74cf98"];
  const ps = Array.from({ length: 90 }, () => ({ x: W / 2 + (Math.random() - .5) * 60, y: H * .55, vx: (Math.random() - .5) * 12, vy: -Math.random() * 14 - 6, r: Math.random() * 6 + 4, a: Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)] }));
  let t = 0; (function f() { x.clearRect(0, 0, W, H); ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .45; p.a += .2; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); }); if (++t < 90) requestAnimationFrame(f); else c.remove(); })();
}
function toast(msg) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.setAttribute("role", "status"); t.className = "toast"; document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, Math.max(2600, msg.length * 60));
}
