:root {

/* ================= Formulaires ================= */
function fld(label, name, value, type = "text", cls = "", extra = "") {
  return `<label class="fl ${cls}">${label}<input id="f_${name}" name="${name}" type="${type}" value="${esc(value ?? "")}" ${type === "number" ? 'step="0.01" inputmode="decimal"' : ""} ${extra}></label>`;
}
function sel(label, name, value, opts, cls = "", extra = "") {
  return `<label class="fl ${cls}">${label}<select id="f_${name}" name="${name}" ${extra}>${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(value ?? "") ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></label>`;
}
function area(label, name, value, cls = "full") { return `<label class="fl ${cls}">${label}<textarea id="f_${name}" name="${name}">${esc(value ?? "")}</textarea></label>`; }
function modal(title, body, onSubmit, opts = {}) {
  const o = document.getElementById("overlay");
  o.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h2>${title}</h2><button class="ghost" onclick="closeOverlay()" aria-label="Fermer">✕</button></div>
  <form class="f" id="mform">${body}<div class="full row" style="justify-content:space-between"><div class="row">${opts.del ? `<button type="button" class="danger" id="mdel">Supprimer</button>` : ""}</div><div class="row">${opts.lecture ? "" : `<button type="button" onclick="closeOverlay()">Annuler</button>`}<button class="primary">${opts.ok || "Enregistrer"}</button></div></div></form></div>`;
  o.hidden = false;
  const f = document.getElementById("mform");
  f.addEventListener("submit", ev => { ev.preventDefault(); const d = Object.fromEntries(new FormData(f).entries()); f.querySelectorAll("input[type=checkbox]").forEach(c => d[c.name] = c.checked); if ((opts.lecture ? onSubmit(d, f) : avecAnnuler(() => onSubmit(d, f))) !== false) { closeOverlay(); save(); render(); } });
  if (opts.del) document.getElementById("mdel").onclick = () => confirmer(opts.delMsg || "Supprimer ?", () => { opts.del(); save(); render(); });
  if (opts.after) opts.after(f);
  const first = f.querySelector("input:not([type=checkbox]):not([type=radio]),select,textarea"); if (first && matchMedia("(pointer: fine)").matches) first.focus();
}
function closeOverlay() { fermerSigPad(); const o = document.getElementById("overlay"); o.hidden = true; o.innerHTML = ""; if (pendingRender) { pendingRender = false; } render(); }
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (document.getElementById("sigpad")) { fermerSigPad(); return; } if (!document.getElementById("overlay").hidden) closeOverlay(); });
function confirmer(msg, yes) {
  const o = document.getElementById("overlay");
  o.innerHTML = `<div class="modal" role="alertdialog" style="width:min(460px,100%)"><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button onclick="closeOverlay()">Annuler</button><button class="primary" id="cyes">Confirmer</button></div></div>`;
  o.hidden = false; document.getElementById("cyes").onclick = () => { closeOverlay(); yes(); };
}

/* ================= Services publics gratuits (sans clé, appelés depuis le téléphone) =================
   - Adresse : Géoplateforme (IGN), https://data.geopf.fr/geocodage/search (50 requêtes/s par adresse IP)
   - DPE : ADEME, jeu "DPE Logements existants (depuis juillet 2021)", Licence Ouverte
   - Risques : Géorisques, API v1 ; l'ERP officiel se fait sur errial.georisques.gouv.fr (gratuit)
   Rien n'est rempli sans que tu le valides. */
async function chercherAdresses(q, n = 5) {
  if (String(q || "").trim().length < 5) return [];
  const r = await fetch("https://data.geopf.fr/geocodage/search?" + new URLSearchParams({ q, autocomplete: "1", limit: String(n), index: "address" }));
  if (!r.ok) throw new Error("Le service d'adresses ne répond pas");
  const j = await r.json();
  return (j.features || []).map(f => ({ label: f.properties.label, rue: f.properties.name, cp: f.properties.postcode, ville: f.properties.city, banId: f.properties.id, lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], score: f.properties.score }));
}
/* Adresse qui se complète en tapant (formulaire du logement) */
function brancherAutoAdresse() {
  const champ = document.getElementById("f_adresse"); if (!champ) return;
  const boite = document.createElement("ul"); boite.className = "sugg-adr"; boite.hidden = true; champ.after(boite);
  let minuteur = null, n = 0, L = [];
  const fixe = (nom, v) => { const h = document.querySelector(`#mform input[name="${nom}"]`); if (h) h.value = v; };
  champ.setAttribute("autocomplete", "off");
  champ.addEventListener("input", () => {
    fixe("banId", ""); fixe("lat", ""); fixe("lon", ""); // l'adresse a changé : on oublie la précédente
    clearTimeout(minuteur); const q = [champ.value, (document.getElementById("f_cp") || {}).value, (document.getElementById("f_ville") || {}).value].join(" ").trim();
    minuteur = setTimeout(async () => {
      const k = ++n; try { L = await chercherAdresses(q); } catch (e) { L = []; }
      if (k !== n) return;
      boite.innerHTML = L.map((a, i) => `<li><button type="button" data-i="${i}">📍 ${esc(a.label)}</button></li>`).join("");
      boite.hidden = !L.length;
      boite.querySelectorAll("button").forEach(b => b.onclick = () => { const a = L[+b.dataset.i];
        champ.value = a.rue; const cp = document.getElementById("f_cp"), vi = document.getElementById("f_ville"); if (cp) cp.value = a.cp; if (vi) vi.value = a.ville;
        fixe("banId", a.banId); fixe("lat", a.lat); fixe("lon", a.lon); boite.hidden = true; });
    }, 350);
  });
  champ.addEventListener("blur", () => setTimeout(() => boite.hidden = true, 250));
}
/* Position et identifiant d'adresse d'un logement (déjà notés, sinon cherchés à partir de l'adresse) */
async function situerBien(bi) {
  if (bi.banId && bi.lat && bi.lon) return { banId: bi.banId, lat: +bi.lat, lon: +bi.lon, label: adresseBien(bi), sur: true };
  const L = await chercherAdresses(adresseBien(bi), 1), a = L[0];
  return a && a.score >= 0.6 ? { ...a, sur: false } : null;
}

const CHAMPS_DPE = "numero_dpe,etiquette_dpe,etiquette_ges,date_etablissement_dpe,date_fin_validite_dpe,adresse_ban,complement_adresse_logement,type_batiment,surface_habitable_logement";
async function dpeListe(qs) {
  const r = await fetch("https://data.ademe.fr/data-fair/api/v1/datasets/dpe03existant/lines?" + new URLSearchParams({ size: "30", qs, select: CHAMPS_DPE, sort: "-date_etablissement_dpe" }));
  if (!r.ok) throw new Error("La base des DPE de l'ADEME ne répond pas");
  return (await r.json()).results || [];
}

async function trouverDpe(bienId, numero) {

  if (LECTURE) { toast("En lecture seule, tu ne peux rien modifier."); return; }

    if (numero) L = await dpeListe(`numero_dpe:"${String(numero).trim().toUpperCase().replace(/[^0-9A-Z]/g, "")}"`);
    else { ou = await situerBien(bi); if (ou) L = await dpeListe(`identifiant_ban:"${ou.banId}"`); }
  } catch (e) { toast(e.message); return; }

  const s = +bi.surface || 0; L.sort((a, b) => (s ? Math.abs((a.surface_habitable_logement || 999) - s) - Math.abs((b.surface_habitable_logement || 999) - s) : 0) || String(b.date_etablissement_dpe).localeCompare(String(a.date_etablissement_dpe)));

      <small>${esc(d.type_batiment || "")}${d.complement_adresse_logement ? " · " + esc(d.complement_adresse_logement) : ""} · fait le ${fds(d.date_etablissement_dpe)} · ${fini ? "⚠️ expiré le " : "valable jusqu'au "}${fds(d.date_fin_validite_dpe)} · n° ${esc(d.numero_dpe)}</small></span></label></li>`; };

      let bas = Math.max(y1, y2), signe = false;

function nombreFr(s) {

function lireReleve(txt) {

      if (cols.montant >= 0) montant = nombreFr(c[cols.montant]);

    } else {
      const brut = c.join(" "); date = dateFr(brut);
      const nums = brut.replace(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/g, " ").match(/[-+]?\s?\d{1,3}(?:[ .  ]\d{3})*(?:,\d{2})|[-+]?\d+\.\d{2}/g);
      if (!nums) return; montant = nombreFr(nums[nums.length - 1].replace(/\s/g, ""));

    }

}
const CAT_MOTS = [[/taxe fonc|dgfip|impot|tresor public/, "Taxe foncière"], [/syndic|copro|foncia|nexity|citya|oralia/, "Charges de copropriété"], [/pret|echeance|credit immo|emprunt/, "Intérêts d'emprunt"], [/assur|axa|maif|macif|mma|allianz|generali|groupama|matmut/, "Assurance propriétaire (PNO)"], [/frais|cotisation|commission|tenue de compte|agios/, "Frais bancaires"], [/edf|engie|totalenergies|veolia|saur|eau /, "Eau / électricité / gaz"], [/expert|comptab|notaire|avocat|huissier|commissaire/, "Honoraires (comptable, notaire, avocat…)"], [/diagnost/, "Diagnostics"], [/leroy|castorama|brico|plomb|electric|artisan|travaux|peinture/, "Travaux d'entretien / réparation"]];

  const pris = new Set();

(function () {

  el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>`; document.body.appendChild(el);

  const cacher = () => { el.style.transition = "opacity .2s, transform .2s"; el.style.opacity = "0"; el.style.transform = "translateY(-50px) scale(.6)"; el.classList.remove("pret", "tourne"); setTimeout(() => { el.style.transition = ""; }, 220); };

async function envoyerCandidature(f) {

}

    ...ev.flatMap(e => ["BEGIN:VEVENT", `UID:${e.id}-${String(ESPACE || "local").slice(0, 8)}@gestion-locative`, `DTSTAMP:${d8(TODAY)}T080000Z`, `DTSTART;VALUE=DATE:${d8(e.d)}`, `DTEND;VALUE=DATE:${d8(addDays(e.d, 1))}`, "SUMMARY:" + esc2(e.t), "DESCRIPTION:" + esc2(e.desc + "\n" + (SB ? LIEN_APPLI : location.origin + location.pathname)), "BEGIN:VALARM", "TRIGGER:PT9H", "ACTION:DISPLAY", "DESCRIPTION:" + esc2(e.t), "END:VALARM", "END:VEVENT"]), "END:VCALENDAR"].map(l => { const c = [...l], o = []; for (let i = 0; i < c.length; i += 70) o.push(c.slice(i, i + 70).join("")); return o.join("\r\n "); }).join("\r\n");

  const ps = Array.from({ length: 90 }, () => ({ x: W / 2 + (Math.random() - .5) * 60, y: H * .55, vx: (Math.random() - .5) * 12, vy: -Math.random() * 14 - 6, r: Math.random() * 6 + 4, a: Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)] }));
