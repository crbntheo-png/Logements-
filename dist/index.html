/* Mise en page : en-tête fixe, contenu centré (max 1120px), cartes blanches nettes ; une carte sombre "solde du mois" en tête ; vert émeraude pour l'action, couleurs d'état réservées */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --surface-glass: rgba(255,255,255,.88); --accent-glow: rgba(11,122,100,.42); --surface-2: #f1f3f6; --surface-3: #e9ecf1;

  --ok: #067647; --ok-soft: #dcfae6; --warn: #b54708; --warn-soft: #fef0c7; --bad: #c4320a; --bad-soft: #fee4e2;
  --night: #0f1b2d; --night-2: #1b2b44; --night-ink: #ffffff; --night-muted: #a9b6cc; --gold: #f5b53d;
  --paper: #ffffff; --paper-ink: #151515;
  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-sm: 10px; --r: 16px; --r-lg: 22px;
  --sh-1: 0 1px 2px rgba(16, 24, 40, .05);
  --sh-2: 0 1px 2px rgba(16, 24, 40, .04), 0 4px 14px rgba(16, 24, 40, .06);
  --sh-3: 0 12px 40px rgba(16, 24, 40, .18);
  --head-h: 60px; --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f16; --surface: #141b26; --surface-glass: rgba(20,27,38,.88); --accent-glow: rgba(60,198,162,.42); --surface-2: #1b2431; --surface-3: #243042;
    --ink: #f2f4f7; --ink-2: #d0d5dd; --muted: #98a2b3; --line: #253041;
    --accent: #3cc6a2; --accent-2: #5fd4b5; --accent-ink: #04241c; --accent-soft: #123329;
    --ok: #47cd89; --ok-soft: #0f2e20; --warn: #fdb022; --warn-soft: #36270b; --bad: #f97066; --bad-soft: #3a1714;
    --night: #17263d; --night-2: #22385a; --night-ink: #ffffff; --night-muted: #a9b6cc; --gold: #f5b53d;
    --sh-1: 0 1px 2px rgba(0,0,0,.4); --sh-2: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25); --sh-3: 0 12px 40px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f16; --surface: #141b26; --surface-glass: rgba(20,27,38,.88); --accent-glow: rgba(60,198,162,.42); --surface-2: #1b2431; --surface-3: #243042;
  --ink: #f2f4f7; --ink-2: #d0d5dd; --muted: #98a2b3; --line: #253041;
  --accent: #3cc6a2; --accent-2: #5fd4b5; --accent-ink: #04241c; --accent-soft: #123329;
  --ok: #47cd89; --ok-soft: #0f2e20; --warn: #fdb022; --warn-soft: #36270b; --bad: #f97066; --bad-soft: #3a1714;
  --night: #17263d; --night-2: #22385a; --night-ink: #ffffff; --night-muted: #a9b6cc; --gold: #f5b53d;
  --sh-1: 0 1px 2px rgba(0,0,0,.4); --sh-2: 0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25); --sh-3: 0 12px 40px rgba(0,0,0,.5);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scrollbar-gutter: stable; -webkit-text-size-adjust: 100%; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body.verrou { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -.02em; text-wrap: balance; }
h1 { font-size: 1.65rem; font-weight: 800; }

.ic.s { width: 16px; height: 16px; vertical-align: -3px; }
.ic-ok { color: var(--ok); } .ic-warn { color: var(--warn); } .ic-bad { color: var(--bad); } .ic-acc { color: var(--accent); }

/* En-tête */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface-glass); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1120px; margin: 0 auto; height: var(--head-h); display: flex; align-items: center; gap: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.brand-t { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }

.brand-t small i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }

.badge { background: var(--bad); color: #fff; border-radius: 99px; font-size: .68rem; font-weight: 800; min-width: 18px; height: 18px; padding: 0 5px; display: inline-grid; place-items: center; font-style: normal; }
.top-acts { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: inline-grid; place-items: center; color: var(--ink-2); background: transparent; border: 0; padding: 0; cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); }
.search-btn { display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; min-width: 230px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font: 500 .9rem var(--font); cursor: pointer; }
.search-btn kbd { margin-left: auto; font: 700 .7rem var(--font); border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 1px 6px; }
.only-m { display: none !important; }
.only-d { display: inline-flex; }
@media (max-width: 860px) { nav.tabs, .search-btn, .only-d { display: none !important; } .only-m { display: inline-grid !important; } }

/* Barre du bas (téléphone) */
#bottomnav { display: none; }
@media (max-width: 860px) {
  #bottomnav { display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); padding: 0 max(6px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(6px, env(safe-area-inset-left, 0px)); background: var(--surface-glass); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-top: 1px solid var(--line); }
  #bottomnav a { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: var(--nav-h); color: var(--muted); font-size: .68rem; font-weight: 700; text-decoration: none; }
  #bottomnav a .ic { width: 23px; height: 23px; }
  #bottomnav a.on { color: var(--accent); }
  #bottomnav a.on .ic { stroke-width: 2.3; }
  #bottomnav .badge { position: absolute; top: 8px; left: calc(50% + 6px); }
  #bottomnav .plus { justify-self: center; width: 52px; height: 52px; border-radius: 16px; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 6px 16px var(--accent-glow); cursor: pointer; }
  #bottomnav .plus .ic { width: 26px; height: 26px; stroke-width: 2.4; }
}

/* Contenu */
main { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; display: flex; flex-direction: column; gap: 22px; min-height: calc(100vh - var(--head-h)); }
@media (max-width: 860px) { main { padding-block: 18px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px)); gap: 20px; } }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.head p { margin-top: 4px; color: var(--muted); }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-weight: 650; font-size: .88rem; margin-bottom: 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card { background: var(--surface); border-radius: var(--r); padding: 18px; box-shadow: var(--sh-2); min-width: 0; }
.card > h2 { margin-bottom: 12px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
.two { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 20px; }
.note { color: var(--muted); font-size: .86rem; }
.empty { color: var(--muted); padding: 26px 18px; text-align: center; background: var(--surface); border-radius: var(--r); box-shadow: var(--sh-1); }
.empty.party { display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 650; color: var(--ink-2); }
.empty.party .ic { width: 34px; height: 34px; color: var(--accent); }

/* Boutons */
button, .btn { font: 650 .9rem/1 var(--font); display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid transparent; background: var(--surface-2); color: var(--ink); cursor: pointer; white-space: nowrap; text-decoration: none; transition: background-color .15s, border-color .15s, color .15s; }
button:hover, .btn:hover { background: var(--surface-3); text-decoration: none; }

button.primary, .btn.primary { background: var(--accent); color: var(--accent-ink); }

button .ic { width: 18px; height: 18px; }

/* Pastilles d'état */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 750; padding: 3px 9px; border-radius: 99px; white-space: nowrap; line-height: 1.4; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.info { background: var(--surface-3); color: var(--muted); } .pill.acc { background: var(--accent-soft); color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--muted); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--gold); } .dot.bad { background: var(--bad); }

/* Bandeau exemple */
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--warn-soft); color: var(--ink); border-radius: var(--r); padding: 12px 14px 12px 16px; font-weight: 650; font-size: .9rem; }
.banner span { display: inline-flex; align-items: center; gap: 8px; }

/* Accueil : salutation et carte du mois */
.greet h1 { font-size: 1.75rem; }
.greet p { color: var(--muted); margin-top: 4px; font-weight: 500; }
.hero { position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 22px; color: var(--night-ink); background: radial-gradient(120% 140% at 100% 0%, var(--night-2) 0%, var(--night) 60%); box-shadow: var(--sh-3); display: grid; gap: 16px; }
.hero::after { content: ""; position: absolute; width: 260px; height: 260px; right: -80px; top: -110px; border-radius: 50%; background: radial-gradient(closest-side, var(--accent-glow), transparent); pointer-events: none; }
.hero-k { color: var(--night-muted); font-weight: 650; font-size: .85rem; display: flex; align-items: center; gap: 6px; }
.hero-k::first-letter { text-transform: uppercase; }
.hero-amount { font-size: 2.3rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.hero-amount small { font-size: 1rem; font-weight: 600; color: var(--night-muted); letter-spacing: 0; }
.hero-bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
.hero-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), #6be3c3); }
.hero-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; position: relative; z-index: 1; }

.hero .cta:hover { background: #eef2f7; }
.hero .cta .ic { color: var(--gold); fill: var(--gold); stroke: var(--gold); }

/* Liste "À faire" courte */
.todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r); box-shadow: var(--sh-2); overflow: hidden; }
.todo li { display: flex; align-items: center; gap: 12px; padding: 13px 14px; min-height: 64px; }
.todo li + li { border-top: 1px solid var(--line); }

.todo li.urgent .ico { background: var(--bad-soft); color: var(--bad); }

.more { display: inline-flex; align-items: center; gap: 4px; font-size: .88rem; }

/* Raccourcis */
.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }

/* Échéancier */
.cal { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 10px; margin: 0 -2px; scrollbar-width: none; }
.cal::-webkit-scrollbar { display: none; }

.cal-i.ok .cal-ico { background: var(--ok-soft); color: var(--ok); } .cal-i.warn .cal-ico { background: var(--warn-soft); color: var(--warn); } .cal-i.acc .cal-ico { background: var(--accent-soft); color: var(--accent); }
.cal-ico .ic { width: 17px; height: 17px; }

/* Tuiles locataires */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.tile { background: var(--surface); border-radius: var(--r); padding: 14px; box-shadow: var(--sh-2); display: flex; flex-direction: column; gap: 12px; }
.tile-head { display: flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; min-width: 0; }

.tile-head .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tile-head b { font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-head small { color: var(--muted); font-size: .82rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.cq:hover { opacity: 1; background: var(--accent-soft); }
.cq-box { padding: 20px; } .cq-box h2 { font-size: 1.1rem; margin: 0; } .cq-box p { line-height: 1.55; }

let ECRITURE = Promise.resolve();

    const aEcrire = changes.filter(c => c[1] !== null).map(([p, v]) => { const [coll, doc_id] = p.split("/"); return { espace_id: esp, coll, doc_id, data: v, maj_le: new Date().toISOString() }; });

}

/* Clé "année-trimestre". Publié vers le 15 du mois qui suit la fin du trimestre. */
const IRL = {
  "2019-1": 129.38, "2019-2": 129.72, "2019-3": 129.99, "2019-4": 130.26,
  "2020-1": 130.57, "2020-2": 130.57, "2020-3": 130.59, "2020-4": 130.52,

  "2022-1": 133.93, "2022-2": 135.84, "2022-3": 136.27, "2022-4": 137.26,

  "2024-1": 143.46, "2024-2": 145.17, "2024-3": 144.51, "2024-4": 144.64,
  "2025-1": 145.47, "2025-2": 146.68, "2025-3": 145.77, "2025-4": 145.78,
  "2026-1": 146.60, "2026-2": 148.37, "2026-3": 148.06

const qKey = l => { const m = /T\s*([1-4])\D*(\d{4})/i.exec(l || ""); return m ? m[2] + "-" + m[1] : null; };
const qLabel = k => { const [y, q] = k.split("-"); return "T" + q + " " + y; };
const qPub = k => { const [y, q] = k.split("-").map(Number); return q === 4 ? new Date(y + 1, 0, 15) : new Date(y, q * 3, 15); };
const irlTable = () => Object.assign({}, IRL, S.irlPerso || {});
const irlVal = k => irlTable()[k];
const irlCles = () => Object.keys(irlTable()).sort((a, b) => { const [ya, qa] = a.split("-").map(Number), [yb, qb] = b.split("-").map(Number); return ya - yb || qa - qb; });

/* Révision annuelle : ce qu'il faut faire pour un bail, calculé tout seul */
function revInfo(b) {
  if (!isActive(b) || b.revisable === false || b.typeBail === "mobilite") return null;
  const entree = P(b.dateEntree); let n = TODAY.getFullYear() - entree.getFullYear(); let anniv = addYears(entree, n);
  if (anniv > addDays(TODAY, 30)) anniv = addYears(entree, --n);
  if (n < 1 || daysBetween(anniv, TODAY) >= 365) return null;
  const lastRev = (b.revisions || []).filter(r => r.type !== "avenant").map(r => r.date).sort().pop();
  if (lastRev && P(lastRev) >= addDays(anniv, -45)) return null;
  const key = "rev-" + b.id + "-" + iso(anniv);
  if (fait(key)) return null;
  const bi = bien(b.bienId);
  if (bi && (bi.dpe === "F" || bi.dpe === "G")) return { key, anniv, statut: "gele" };
  const ref = qKey(b.irlTrimestre) || irlEnVigueur(entree), q = ref.split("-")[1];
  let y = anniv.getFullYear() + 1; while (qPub(y + "-" + q) > anniv) y--;
  const newKey = y + "-" + q, oldKey = (y - 1) + "-" + q;
  const newVal = irlVal(newKey), oldVal = irlVal(oldKey) || +b.irlValeur;
  const ancien = loyerAt(b, mk(anniv)).hc;
  if (!newVal || !oldVal) return { key, anniv, statut: "attente", newKey, pub: qPub(newKey), ancien };
  const nouveau = r2(ancien * newVal / oldVal);
  return { key, anniv, statut: "pret", newKey, oldKey, newVal, oldVal, ancien, nouveau, charges: loyerAt(b, mk(anniv)).ch };
}

  return by;
}

/* ================= Formulaires ================= */
function fld(label, name, value, type = "text", cls = "", extra = "") {
  return `<label class="fl ${cls}">${label}<input id="f_${name}" name="${name}" type="${type}" value="${esc(value ?? "")}" ${type === "number" ? 'step="0.01" inputmode="decimal"' : ""} ${extra}></label>`;
}
function sel(label, name, value, opts, cls = "", extra = "") {
  return `<label class="fl ${cls}">${label}<select id="f_${name}" name="${name}" ${extra}>${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(value ?? "") ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></label>`;
}
function area(label, name, value, cls = "full") { return `<label class="fl ${cls}">${label}<textarea id="f_${name}" name="${name}">${esc(value ?? "")}</textarea></label>`; }
function modal(title, body, onSubmit, opts = {}) {
  const o = document.getElementById("overlay");
  o.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h2>${title}</h2><button class="ghost" onclick="closeOverlay()" aria-label="Fermer">✕</button></div>
  <form class="f" id="mform">${body}<div class="full row" style="justify-content:space-between"><div class="row">${opts.del ? `<button type="button" class="danger" id="mdel">Supprimer</button>` : ""}</div><div class="row">${opts.lecture ? "" : `<button type="button" onclick="closeOverlay()">Annuler</button>`}<button class="primary">${opts.ok || "Enregistrer"}</button></div></div></form></div>`;
  o.hidden = false;
  const f = document.getElementById("mform");
  f.addEventListener("submit", ev => { ev.preventDefault(); const d = Object.fromEntries(new FormData(f).entries()); f.querySelectorAll("input[type=checkbox]").forEach(c => d[c.name] = c.checked); if ((opts.lecture ? onSubmit(d, f) : avecAnnuler(() => onSubmit(d, f))) !== false) { closeOverlay(); save(); render(); } });
  if (opts.del) document.getElementById("mdel").onclick = () => confirmer(opts.delMsg || "Supprimer ?", () => { opts.del(); save(); render(); });
  if (opts.after) opts.after(f);
  const first = f.querySelector("input:not([type=checkbox]),select,textarea"); if (first && matchMedia("(pointer: fine)").matches) first.focus();
}
function closeOverlay() { const o = document.getElementById("overlay"); o.hidden = true; o.innerHTML = ""; if (pendingRender) { pendingRender = false; } render(); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && !document.getElementById("overlay").hidden) closeOverlay(); });
function confirmer(msg, yes) {
  const o = document.getElementById("overlay");
  o.innerHTML = `<div class="modal" role="alertdialog" style="width:min(460px,100%)"><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button onclick="closeOverlay()">Annuler</button><button class="primary" id="cyes">Confirmer</button></div></div>`;
  o.hidden = false; document.getElementById("cyes").onclick = () => { closeOverlay(); yes(); };
}

  if (!S.biens.length) { confirmer("Ajoutez d'abord un bien.", () => editBien()); return; }
  modal(id ? "Modifier le locataire" : "Nouveau locataire", `
    <fieldset><legend>Locataire</legend>

    ${fld("Date d'entrée", "dateEntree", b.dateEntree, "date", "", "required")}${fld("Date de sortie (si connue)", "dateSortie", b.dateSortie, "date")}
    ${fld("Suivre les loyers à partir de (mois)", "suiviDepuis", b.suiviDepuis, "month")}${fld("Durée bail mobilité (mois)", "dureeMobilite", b.dureeMobilite || 10, "number")}</fieldset>
    <fieldset><legend>Argent</legend>
    ${fld("Loyer hors charges (€)", "loyerHC", b.loyerHC, "number", "", "required")}${fld("Charges (€ / mois)", "charges", b.charges || 0, "number")}
    ${sel("Charges", "chargesMode", b.chargesMode, [["provision", "Provision + régularisation annuelle"], ["forfait", "Forfait (meublé / colocation)"]])}${fld("Payé le … de chaque mois", "jourPaiement", b.jourPaiement, "number", "", 'min="1" max="31" step="1"')}
    ${fld("Dépôt de garantie (€)", "depot", b.depot, "number")}${fld("Dépôt rendu le", "depotRestitue", b.depotRestitue, "date")}

    ${SB ? fld("Nom sur ses virements, si différent (ex : FRAVELLE ; séparer par des virgules)", "motsBanque", b.motsBanque, "text", "full") : ""}

async function encaisser(bailId, m) {
  const b = bail(bailId), e = echeance(b, m); if (!e || e.reste <= 0) return;
  confettis();
  avecAnnuler(() => { S.paiements.push({ id: uid(), bailId, mois: m, montant: e.reste, date: iso(TODAY), mode: "virement" }); save(); render();
    toast(`${eur(e.reste)} reçus · quittance prête`); });
}
function saisirPaiement(bailId, m) {
  const e = echeance(bail(bailId), m), p0 = planEtat(e.b), planActif = p0 && !p0.fait;
  modal(`Paiement — ${esc(e.b.nom)}, ${fm(m)}`, `<p class="full note">Dû : ${eur(e.du)} · déjà reçu : ${eur(e.paye)} · reste : <b>${eur(e.reste)}</b></p>
    ${fld("Montant reçu (€)", "montant", e.reste, "number", "", "required")}${fld("Reçu le", "date", iso(TODAY), "date", "", "required")}

    if (tag === "DIV" && (cl.contains("two-col") || cl.contains("sign"))) {

      const y1 = column(kids[0], M, W / 2 - 5), y2 = kids[1] ? column(kids[1], M + W / 2 + 5, W / 2 - 5) : y;
      y = Math.max(y1, y2) + (cl.contains("sign") ? 25 : 4); return;
    }
    if (tag === "H1") { y += 3; write(el.textContent, { size: 15, bold: true, align: "center" }); y += 1; return; }

    if (tag === "DIV" && !cl.length) { [...el.children].forEach(block); if (!el.children.length) lines(el).forEach(l => write(l)); return; }

}
