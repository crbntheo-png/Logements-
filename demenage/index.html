<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestion locative</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f5f7;color:#0f1b2d;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px}div{background:#fff;border-radius:20px;padding:28px;max-width:380px;text-align:center;box-shadow:0 8px 30px #0001}a{display:block;margin-top:18px;background:#0b7a64;color:#fff;padding:14px;border-radius:12px;text-decoration:none;font-weight:700}p{color:#5b6472;line-height:1.5}</style></head>
<body><div><h1>L'appli a déménagé 🏠</h1><p>Elle est maintenant ici. Ouvre ce lien, connecte-toi, puis réinstalle l'icône sur ton écran d'accueil (et supprime l'ancienne).</p><a href="https://gestion-locative-sci.pages.dev/">Ouvrir la nouvelle appli</a></div>
<script>if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));if(window.caches)caches.keys().then(k=>k.forEach(c=>caches.delete(c)));setTimeout(()=>location.replace("https://gestion-locative-sci.pages.dev/"),2500);</script></body></html>
